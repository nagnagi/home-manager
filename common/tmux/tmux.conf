set -g display-time 1000
# ===== status line =====

setw -g status-style fg=colour255,bg=colour234

set-option -g status-interval 1
set-option -g status-right '#(date "+%F")'

# ===== keybinds =====
bind -n M-q confirm-before -p "kill-pane? (y/n)" kill-pane

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind c new-window -c "#{pane_current_path}"

bind a command-prompt -I "#W" "new-session -s '%%'"

bind r command-prompt -I "#W" "rename-window '%%'"
bind R command-prompt -I "#W" "rename-session '%%'"

bind y set-window-option synchronize-panes off
bind Y set-window-option synchronize-panes on

bind V join-pane -h -s '.' -t '{next}'
bind S join-pane -v -s '.' -t '{next}'
bind ] join-pane -s '.' -t ':{next}'
bind [ join-pane -s '.' -t ':{previous}'

bind -r g select-layout -n

bind M-c new-window -c "#{pane_current_path}"

bind M-a command-prompt -I "#W" "new-session -s '%%'"

bind M-r command-prompt -I "#W" "rename-window '%%'"
bind M-R command-prompt -I "#W" "rename-session '%%'"

bind M-y set-window-option synchronize-panes off
bind M-Y set-window-option synchronize-panes on

bind M-V join-pane -h -s '.' -t '{next}'
bind M-S join-pane -v -s '.' -t '{next}'
bind M-] join-pane -s '.' -t ':{next}'
bind M-[ join-pane -s '.' -t ':{previous}'

bind -r M-g select-layout -n

bind M-n select-window -t ':{next}'
bind M-p select-window -t ':{previous}'

# ===== vi like operation =====

bind s split-window -v -b -c "#{pane_current_path}"
bind v split-window -h -b -c "#{pane_current_path}"
bind x swap-pane -s '.' -t '{last}'

bind T break-pane
bind q confirm-before -p "kill-pane? (y/n)" kill-pane
bind o confirm-before -p "kill-pane? (y/n)" "kill-pane -a"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind H join-pane -b -h -t '{left}'
bind J join-pane    -v -t '{bottom}'
bind K join-pane -b -v -t '{top}'
bind L join-pane    -h -t '{right}'

bind = select-layout even-horizontal

bind -r < resize-pane -L 10
bind -r > resize-pane -R 10
bind -r + resize-pane -U 10
bind -r - resize-pane -D 10

bind M-s split-window -v -b -c "#{pane_current_path}"
bind M-v split-window -h -b -c "#{pane_current_path}"
bind M-x swap-pane -s '.' -t '{last}'

bind M-T break-pane
bind M-q confirm-before -p "kill-pane? (y/n)" kill-pane
bind M-o confirm-before -p "kill-pane? (y/n)" "kill-pane -a"

bind M-h select-pane -L
bind M-j select-pane -D
bind M-k select-pane -U
bind M-l select-pane -R
bind M-w select-pane -t '{next}'

bind M-H join-pane -b -h -t '{left}'
bind M-J join-pane    -v -t '{bottom}'
bind M-K join-pane -b -v -t '{top}'
bind M-L join-pane    -h -t '{right}'

bind M-= select-layout even-horizontal

bind -r M-< resize-pane -L 10
bind -r M-> resize-pane -R 10
bind -r M-+ resize-pane -U 10
bind -r M-- resize-pane -D 10

